<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00A88E"/>
      <stop offset="100%" stop-color="#00C4A7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#00A88E" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="560" y1="0" x2="560" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="720" y1="0" x2="720" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="880" y1="0" x2="880" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1040" y1="0" x2="1040" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
    <line x1="1200" y1="0" x2="1200" y2="640"/>
  </g>

  <!-- Glow orb left -->
  <circle cx="180" cy="320" r="220" fill="#00A88E" opacity="0.06" filter="url(#softglow)"/>

  <!-- QR Code visual (right side) -->
  <g transform="translate(860, 140)" opacity="0.85">
    <!-- QR outer border -->
    <rect x="0" y="0" width="320" height="320" rx="16" fill="none" stroke="#00A88E" stroke-width="2" opacity="0.4"/>
    <!-- QR corner squares -->
    <!-- Top-left finder -->
    <rect x="20" y="20" width="80" height="80" rx="6" fill="none" stroke="#00A88E" stroke-width="3"/>
    <rect x="34" y="34" width="52" height="52" rx="3" fill="#00A88E" opacity="0.7"/>
    <rect x="46" y="46" width="28" height="28" rx="2" fill="#0A1628"/>
    <!-- Top-right finder -->
    <rect x="220" y="20" width="80" height="80" rx="6" fill="none" stroke="#00A88E" stroke-width="3"/>
    <rect x="234" y="34" width="52" height="52" rx="3" fill="#00A88E" opacity="0.7"/>
    <rect x="246" y="46" width="28" height="28" rx="2" fill="#0A1628"/>
    <!-- Bottom-left finder -->
    <rect x="20" y="220" width="80" height="80" rx="6" fill="none" stroke="#00A88E" stroke-width="3"/>
    <rect x="34" y="234" width="52" height="52" rx="3" fill="#00A88E" opacity="0.7"/>
    <rect x="46" y="246" width="28" height="28" rx="2" fill="#0A1628"/>
    <!-- Center skull icon -->
    <rect x="126" y="126" width="68" height="68" rx="10" fill="#0A1628" stroke="#00A88E" stroke-width="1.5"/>
    <text x="160" y="172" font-size="38" text-anchor="middle" fill="#00A88E">💀</text>
    <!-- Random QR dots (simulated) -->
    <g fill="#00A88E" opacity="0.55">
      <rect x="120" y="20" width="10" height="10" rx="1"/>
      <rect x="136" y="20" width="10" height="10" rx="1"/>
      <rect x="152" y="20" width="10" height="10" rx="1"/>
      <rect x="120" y="36" width="10" height="10" rx="1"/>
      <rect x="152" y="36" width="10" height="10" rx="1"/>
      <rect x="120" y="52" width="10" height="10" rx="1"/>
      <rect x="136" y="52" width="10" height="10" rx="1"/>
      <rect x="152" y="52" width="10" height="10" rx="1"/>
      <rect x="168" y="20" width="10" height="10" rx="1"/>
      <rect x="184" y="36" width="10" height="10" rx="1"/>
      <rect x="200" y="20" width="10" height="10" rx="1"/>
      <rect x="200" y="52" width="10" height="10" rx="1"/>
      <rect x="20" y="120" width="10" height="10" rx="1"/>
      <rect x="36" y="120" width="10" height="10" rx="1"/>
      <rect x="20" y="136" width="10" height="10" rx="1"/>
      <rect x="52" y="136" width="10" height="10" rx="1"/>
      <rect x="20" y="152" width="10" height="10" rx="1"/>
      <rect x="36" y="152" width="10" height="10" rx="1"/>
      <rect x="52" y="152" width="10" height="10" rx="1"/>
      <rect x="20" y="168" width="10" height="10" rx="1"/>
      <rect x="52" y="168" width="10" height="10" rx="1"/>
      <rect x="36" y="184" width="10" height="10" rx="1"/>
      <rect x="52" y="184" width="10" height="10" rx="1"/>
      <rect x="220" y="120" width="10" height="10" rx="1"/>
      <rect x="236" y="120" width="10" height="10" rx="1"/>
      <rect x="252" y="136" width="10" height="10" rx="1"/>
      <rect x="220" y="152" width="10" height="10" rx="1"/>
      <rect x="252" y="152" width="10" height="10" rx="1"/>
      <rect x="220" y="168" width="10" height="10" rx="1"/>
      <rect x="236" y="184" width="10" height="10" rx="1"/>
      <rect x="252" y="184" width="10" height="10" rx="1"/>
      <rect x="220" y="200" width="10" height="10" rx="1"/>
      <rect x="236" y="200" width="10" height="10" rx="1"/>
      <rect x="252" y="200" width="10" height="10" rx="1"/>
      <!-- bottom row dots -->
      <rect x="120" y="220" width="10" height="10" rx="1"/>
      <rect x="152" y="220" width="10" height="10" rx="1"/>
      <rect x="168" y="236" width="10" height="10" rx="1"/>
      <rect x="184" y="220" width="10" height="10" rx="1"/>
      <rect x="200" y="236" width="10" height="10" rx="1"/>
      <rect x="120" y="252" width="10" height="10" rx="1"/>
      <rect x="136" y="252" width="10" height="10" rx="1"/>
      <rect x="200" y="252" width="10" height="10" rx="1"/>
      <rect x="120" y="268" width="10" height="10" rx="1"/>
      <rect x="152" y="268" width="10" height="10" rx="1"/>
      <rect x="184" y="268" width="10" height="10" rx="1"/>
      <rect x="200" y="268" width="10" height="10" rx="1"/>
      <rect x="136" y="284" width="10" height="10" rx="1"/>
      <rect x="168" y="284" width="10" height="10" rx="1"/>
    </g>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="300" width="320" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- WIT badge -->
  <rect x="80" y="120" width="120" height="36" rx="6" fill="#00A88E" opacity="0.15"/>
  <rect x="80" y="120" width="120" height="36" rx="6" fill="none" stroke="#00A88E" stroke-width="1.5" opacity="0.6"/>
  <text x="140" y="143" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#00A88E" text-anchor="middle" letter-spacing="2">WIT-IT</text>

  <!-- Main title -->
  <text x="80" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Security</text>
  <text x="80" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#accent)" letter-spacing="-1">Awareness</text>

  <!-- Subtitle -->
  <text x="80" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#8DA0B4" font-weight="400">Demo interativo de ataque via QR Code malicioso</text>

  <!-- Feature pills -->
  <g transform="translate(80, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="34" rx="17" fill="rgba(0,168,142,0.12)" stroke="#00A88E" stroke-width="1" opacity="0.8"/>
    <text x="82" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#00C4A7" text-anchor="middle" font-weight="600">🎯  Simulação real</text>
    <!-- Pill 2 -->
    <rect x="181" y="0" width="175" height="34" rx="17" fill="rgba(0,168,142,0.12)" stroke="#00A88E" stroke-width="1" opacity="0.8"/>
    <text x="268" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#00C4A7" text-anchor="middle" font-weight="600">📱  Mobile + Telão</text>
    <!-- Pill 3 -->
    <rect x="372" y="0" width="175" height="34" rx="17" fill="rgba(0,168,142,0.12)" stroke="#00A88E" stroke-width="1" opacity="0.8"/>
    <text x="459" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#00C4A7" text-anchor="middle" font-weight="600">🔐  5 lições</text>
  </g>

  <!-- Terminal line decoration -->
  <g transform="translate(80, 490)" opacity="0.5">
    <text font-family="'Courier New', monospace" font-size="13" fill="#00A88E">
      <tspan x="0" dy="0" fill="#4A6075">$</tspan>
      <tspan fill="#00A88E"> git clone </tspan>
      <tspan fill="#8DA0B4">cesarromani-tech/wit-security-awareness</tspan>
    </text>
    <text font-family="'Courier New', monospace" font-size="13" fill="#00A88E">
      <tspan x="0" dy="22" fill="#4A6075">$</tspan>
      <tspan fill="#00A88E"> open </tspan>
      <tspan fill="#8DA0B4">demo-ataque.html</tspan>
    </text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1280" height="50" fill="rgba(0,168,142,0.06)"/>
  <line x1="0" y1="590" x2="1280" y2="590" stroke="#00A88E" stroke-width="1" opacity="0.3"/>
  <text x="80" y="621" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#4A6075">wit-it.com.br</text>
  <text x="640" y="621" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#4A6075" text-anchor="middle">Conscientização em Segurança Digital · Treinamento Corporativo</text>
  <text x="1200" y="621" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#4A6075" text-anchor="end">© Wit-it Tecnologia</text>
</svg>
